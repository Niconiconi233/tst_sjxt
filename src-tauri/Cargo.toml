[package]
name = "audit-workspace"
version = "0.1.0"
description = "审计组工作管理系统"
authors = ["Audit Team"]
edition = "2021"
rust-version = "1.77.2"

# 供 Tauri 移动端 / 桌面端复用
[lib]
name = "audit_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地持久化：SQLite（bundled 静态编译，无需系统依赖）
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
