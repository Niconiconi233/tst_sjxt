name: Release

# 触发方式
#   1) 推送版本标签： git tag v0.1.0 && git push origin v0.1.0
#   2) 手动触发：Actions → Release → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '创建为草稿发布（不自动公开）'
        type: boolean
        default: true

# tauri-action 需要写 Release 的权限；同时读取仓库内容
permissions:
  contents: write

# 同一版本串行发布，避免多个平台 / 变体互相覆盖同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 前端打包（terser 压缩 Univer 体积较大）容易触发 Node 默认堆上限，这里放宽
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      # 单个平台失败不影响其它平台继续出包
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon (arm64)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            assetPattern: ''
          - label: macOS Intel (x64)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            assetPattern: ''

          # 变体一：内置 WebView2 离线运行时（约 +130MB），适合内网 / 无网机器
          - label: Windows x64 · 离线版（内置 WebView2）
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
            assetPattern: '[name]_[version]_[arch]_offline[setup][ext]'

          # 变体二：不含 WebView2，安装时按需联网下载，体积小
          # 通过 --config 覆盖 tauri.conf.json 默认的 offlineInstaller；
          # 覆盖文件里刻意重复写了 nsis 配置，避免不同合并语义下安装界面/安装模式回落默认值
          - label: Windows x64 · 在线版（不含 WebView2）
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --config src-tauri/tauri.online.conf.json'
            assetPattern: '[name]_[version]_[arch]_online[setup][ext]'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要在 Intel 机器上产出 arm64 包（或反之），显式添加目标平台
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      # 防止 tag 与 tauri.conf.json 版本不一致导致 Release 版本号错乱
      - name: 校验标签与版本号是否一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VER app=$CONF_VER"
          if [ "$CONF_VER" != "$TAG_VER" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 tauri.conf.json 中的 version($CONF_VER) 不一致"
            exit 1
          fi

      # Windows 上 rusqlite 的 bundled 特性需要本地 C 编译器，
      # windows-latest 已自带 MSVC，无需额外安装；macOS 自带 clang。
      # Windows 跑两个变体：默认配置出「离线版」（内置 WebView2，构建时会从微软下载约 130MB），
      # 带 --config 的变体出「在线版」（安装时按需下载 WebView2，安装包小）。
      # 两者产物名通过 releaseAssetNamePattern 加 _offline / _online 后缀区分，避免同名冲突。
      - name: 构建并上传 Release 产物
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- 可选：代码签名与公证（配置对应的 Secrets 后取消注释）----
          # macOS 签名 + 公证：需 APPLE_CERTIFICATE（.p12 的 base64）、
          # APPLE_CERTIFICATE_PASSWORD、APPLE_SIGNING_IDENTITY、APPLE_ID、
          # APPLE_PASSWORD（App 专用密码）、APPLE_TEAM_ID
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名（EV/OV 证书）：需 WINDOWS_CERTIFICATE 与密码
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # v__VERSION__ 会被替换为 tauri.conf.json 中的 version，
          # 标签发布与手动触发都能得到一致的版本号
          tagName: v__VERSION__
          releaseName: '审计组工作管理系统 v__VERSION__'
          releaseBody: |
            审计组工作管理系统 v__VERSION__ 桌面安装包。

            - macOS：`.dmg`（Apple Silicon 为 aarch64，Intel 为 x64）
            - Windows 离线版 `_offline`：`-setup.exe`（NSIS）与 `.msi`，内置 WebView2 运行时，
              安装包约 +130 MB，可在完全离线的机器上一键安装（推荐内网部署使用）
            - Windows 在线版 `_online`：`-setup.exe`（NSIS）与 `.msi`，不含 WebView2，
              体积小；系统缺少运行时会联网下载（Windows 10 1803 以上通常已自带）

            系统要求：Windows 10 1803 及以上（64 位）或 Windows 11。

            Windows 安装程序为简体中文界面，默认安装到 `C:\Program Files`（需管理员权限），
            同一台机器的多个 Windows 账户共用一套程序；审计数据按 Windows 账户分别存放在
            `%APPDATA%\cn.audit.workspace\` 下，互不可见。

            数据保存在本机 SQLite 文件中，卸载或升级不会清除已有审计数据。
            当前安装包未做代码签名，macOS 首次打开如提示"已损坏/无法验证开发者"，
            可在"系统设置 → 隐私与安全性"中允许，或执行：
            `xattr -dr com.apple.quarantine /Applications/AuditWorkspace.app`
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.args }}
          # 给 Windows 两个变体加 _offline / _online 后缀，macOS 传空串则保留 Tauri 默认命名
          releaseAssetNamePattern: ${{ matrix.assetPattern }}
          # 多个任务并发创建/上传同一个 Release，失败时自动重试
          retryAttempts: 3
