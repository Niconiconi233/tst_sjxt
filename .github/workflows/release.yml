name: Release

# 触发方式
#   1) 推送版本标签： git tag v0.1.0 && git push origin v0.1.0
#   2) 手动触发：Actions → Release → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '创建为草稿发布（不自动公开）'
        type: boolean
        default: true

# tauri-action 需要写 Release 的权限；同时读取仓库内容
permissions:
  contents: write

# 同一版本串行发布，避免多个平台 / 变体互相覆盖同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 前端打包（terser 压缩 Univer 体积较大）容易触发 Node 默认堆上限，这里放宽
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      # 单个平台失败不影响其它平台继续出包
      fail-fast: false
      matrix:
        include:
          # macOS 只出 Apple Silicon（aarch64）版本；不再构建 Intel (x64) 版本。
          - label: macOS Apple Silicon (arm64)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            assetPattern: ''

          # 标准版（推荐）：不含 WebView2 运行时，安装包约 15 MB 以内。
          # 采用 tauri.conf.json 默认的 downloadBootstrapper：安装时检测系统，
          # 已有 WebView2（Win11 全部、Win10 1803+ 绝大多数）就直接跳过，不联网。
          # 显式传默认命名 pattern，保证与离线版的命名走同一条代码路径。
          - label: Windows x64 · 标准版
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
            assetPattern: '[name]_[version]_[arch][setup][ext]'

          # 32 位（x86）标准版：供仍在使用 32 位 Windows 的老旧机器。
          # WebView2 运行时同样有 x86 版本，downloadBootstrapper 会自动匹配。
          - label: Windows x86 (32 位) · 标准版
            platform: windows-latest
            target: i686-pc-windows-msvc
            args: '--target i686-pc-windows-msvc'
            assetPattern: '[name]_[version]_[arch][setup][ext]'

          # 离线版：内置 WebView2 离线运行时（约 +130 MB），仅供确实装不上 WebView2
          # 的内网 / 企业版系统应急使用，通过 --config 覆盖默认的 downloadBootstrapper；
          # 覆盖文件里刻意重复写了 nsis 配置，避免不同合并语义下安装界面/安装模式回落默认值。
          # 注意：三个 Windows 变体的产物名必须互不相同，否则后完成的 job 会把
          # 先完成的 job 传的同名资产删掉重传（tauri-action 的同名覆盖行为），
          # 曾因此出现「标准版 15MB 被离线版 213MB 覆盖、Release 里全是全量包」。
          # 离线版靠 _offline 后缀区分；x64 与 x86 靠 [arch] 天然区分。
          - label: Windows x64 · 离线版（内置 WebView2）
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --config src-tauri/tauri.offline.conf.json'
            assetPattern: '[name]_[version]_[arch]_offline[setup][ext]'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要在 Intel 机器上产出 arm64 包（或反之），显式添加目标平台
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      # 防止 tag 与 tauri.conf.json 版本不一致导致 Release 版本号错乱
      - name: 校验标签与版本号是否一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VER app=$CONF_VER"
          if [ "$CONF_VER" != "$TAG_VER" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 tauri.conf.json 中的 version($CONF_VER) 不一致"
            exit 1
          fi

      # Windows 上 rusqlite 的 bundled 特性需要本地 C 编译器，
      # windows-latest 已自带 MSVC，无需额外安装；macOS 自带 clang。
      # Windows 跑三个变体：x64 / x86 标准版 + x64 离线版（内置 WebView2，约 130MB）。
      # Windows 只出 NSIS（setup.exe）：tauri.conf.json 的 bundle.targets 已限定为
      # dmg/app/nsis，不再产出 WiX 的 .msi（其语言默认 en-US，且曾与标准版同名互相覆盖）。
      - name: 构建并上传 Release 产物
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- 可选：代码签名与公证（配置对应的 Secrets 后取消注释）----
          # macOS 签名 + 公证：需 APPLE_CERTIFICATE（.p12 的 base64）、
          # APPLE_CERTIFICATE_PASSWORD、APPLE_SIGNING_IDENTITY、APPLE_ID、
          # APPLE_PASSWORD（App 专用密码）、APPLE_TEAM_ID
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名（EV/OV 证书）：需 WINDOWS_CERTIFICATE 与密码
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # v__VERSION__ 会被替换为 tauri.conf.json 中的 version，
          # 标签发布与手动触发都能得到一致的版本号
          tagName: v__VERSION__
          releaseName: '审计组工作管理系统 v__VERSION__'
          releaseBody: |
            审计组工作管理系统 v__VERSION__ 桌面安装包。

            - macOS：`.dmg`，仅提供 Apple Silicon（aarch64，M1 及以上）版本
            - Windows 标准版（推荐）：`-setup.exe`（NSIS，简体中文安装界面），安装包约 15 MB。
              安装时自动检测系统内的 WebView2：已安装则直接跳过、完全不联网；
              缺失时才即时下载（Windows 11 全部预装，Windows 10 1803 以上绝大多数已随 Edge 更新预装）
              - `_x64-setup.exe`：64 位 Windows
              - `_i686-setup.exe`：32 位 Windows（老旧机器）
            - Windows 离线版 `_offline`：内置 WebView2 离线运行时，安装包约 150 MB，
              仅供确实装不上 WebView2 的内网 / 企业版系统应急使用

            系统要求：Windows 10 1803 及以上（32 / 64 位）或 Windows 11。

            Windows 安装程序为简体中文界面，默认安装到 `C:\Program Files`（需管理员权限），
            同一台机器的多个 Windows 账户共用一套程序；审计数据按 Windows 账户分别存放在
            `%APPDATA%\cn.audit.workspace\` 下，互不可见。

            数据保存在本机 SQLite 文件中，卸载或升级不会清除已有审计数据。
            当前安装包未做代码签名，macOS 首次打开如提示"已损坏/无法验证开发者"，
            可在"系统设置 → 隐私与安全性"中允许，或执行：
            `xattr -dr com.apple.quarantine /Applications/AuditWorkspace.app`
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.args }}
          # 给 Windows 两个变体加 _offline / _online 后缀，macOS 传空串则保留 Tauri 默认命名
          releaseAssetNamePattern: ${{ matrix.assetPattern }}
          # 多个任务并发创建/上传同一个 Release，失败时自动重试
          retryAttempts: 3
